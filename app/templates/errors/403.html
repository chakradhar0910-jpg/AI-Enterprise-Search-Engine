{% extends "base.html" %}

{% block title %}403 Forbidden Access{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="stat-icon icon-orange mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
    <i class="bi bi-shield-x"></i>
  </div>
  <h1 class="display-3 fw-bold text-danger mb-2">403</h1>
  <h4 class="fw-bold text-dark mb-3">Access Denied / Insufficient Permissions</h4>
  <p class="text-muted small mb-4" style="max-width: 460px; margin: 0 auto;">
    You do not possess the required departmental clearance or administrative privileges to inspect this resource.
  </p>
  <a href="{{ url_for('dashboard.dashboard_view') }}" class="btn btn-enterprise-primary">
    <i class="bi bi-arrow-left me-1"></i> Return to Safe Workspace
  </a>
</div>
{% endblock %}
